name: Windows MSYS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v3

    - uses: msys2/setup-msys2@v2
      with:
        msystem: ucrt64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gtk3
          mingw-w64-ucrt-x86_64-toolchain
          base-devel
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-curl
          mingw-w64-ucrt-x86_64-gtkmm3
          mingw-w64-ucrt-x86_64-librsvg
          mingw-w64-ucrt-x86_64-libsoup3

    - name: Build Application
      run: |
        rm resources.cc
        glib-compile-resources --target=resources.cc --generate-source resources.xml
        make BUILD=release

    - name: Setup Runtime Dependencies
      run: |
        mkdir -p build/release/lib/gdk-pixbuf-2.0/2.10.0/loaders
        mkdir -p build/release/share/glib-2.0/schemas
        mkdir -p build/release/share/icons
        
        # Copy GTK and dependencies DLLs
        ldd build/release/checksums.exe | grep '/ucrt64/bin/' | awk '{print $3}' | xargs -I {} cp {} build/release/ 2>/dev/null || true
        cp /ucrt64/bin/librsvg-2-2.dll build/release/
        
        # Copy pixbuf loaders
        cp /ucrt64/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll build/release/lib/gdk-pixbuf-2.0/2.10.0/loaders/ 2>/dev/null || true
        cp /ucrt64/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache build/release/lib/gdk-pixbuf-2.0/2.10.0/ 2>/dev/null || true
        ldd build/release/lib/gdk-pixbuf-2.0/2.10.0/loaders/pixbufloader_svg.dll | grep '/ucrt64/bin/' | awk '{print $3}' | xargs -I {} cp {} build/release/ 2>/dev/null || true
        
        # Copy schemas
        cp /ucrt64/share/glib-2.0/schemas/*.gschema.xml build/release/share/glib-2.0/schemas/ 2>/dev/null || true
        
        # Copy icon theme
        cp -r /ucrt64/share/icons/hicolor build/release/share/icons/ 2>/dev/null || true
        cp -r /ucrt64/share/icons/Adawita build/release/share/icons/ 2>/dev/null || true
        
        # Compile schemas
        glib-compile-schemas build/release/share/glib-2.0/schemas/

    - name: Add makeappx.exe command to path.
      shell: powershell
      run: |
        $sdkBinPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -File | Where-Object {$_.Name -eq "makeappx.exe" -and $_.Directory.Name -eq "x64"} |Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty DirectoryName
        if ($null -eq $sdkBinPath) {
          throw "MakeAppx.exe not found in the expected Windows Kits directory."
        }
        Write-Host "Found MakeAppx.exe at: $sdkBinPath"
        echo "$sdkBinPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Create MSIX Package
      shell: powershell
      run: |
        mkdir -p build/msix
        $version = (Get-Content VERSION).Trim()
        $manifestPath = "AppxManifest.xml"
        [xml]$xml = Get-Content $manifestPath
        $xml.Package.Identity.Version = $version
        $xml.Save($manifestPath)
        Write-Host "Updated manifest to version $version"
        cp AppxManifest.xml build/release
        cp -r images build\release
        makeappx.exe pack /d build/release /p build/msix/checksums-app.msix
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: checksums-windows
        path: |
          build/release/
          build/msix/
